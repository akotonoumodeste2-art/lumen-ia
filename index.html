<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMEN_IA V2 - BY MODESTE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui,Arial;min-height:100vh}
.header{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#000;z-index:10}
.login-box{max-width:360px;margin:8vh auto;background:#0f0f0f;border:1px solid #ff1a1a33;padding:28px;border-radius:20px;text-align:center}
input{width:100%;padding:14px;background:#000;border:1px solid #333;color:#fff;border-radius:10px;margin-bottom:12px;outline:none}
input:focus{border-color:#ff1a1a}
.btn{width:100%;padding:14px;background:#ff1a1a;border:none;color:#fff;font-weight:900;border-radius:10px;cursor:pointer;letter-spacing:1px}
.btn:active{transform:scale(0.98)}
.dash{display:none;flex-direction:column;height:100vh}
.tabs{display:flex;gap:10px;padding:10px 15px;overflow-x:auto}
.tab{padding:10px 18px;background:#111;border:1px solid #222;border-radius:20px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:700}
.tab.active{background:#ff1a1a;border-color:#ff1a1a}
.chat-area{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;background:#080808}
.msg{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.4;font-size:14px}
.msg.ia{background:#151515;border:1px solid #222;align-self:flex-start}
.msg.user{background:#ff1a1a;align-self:flex-end}
.input-area{display:flex;gap:8px;padding:12px;border-top:1px solid #1a1a1a;background:#000}
.icon-btn{min-width:48px;height:48px;background:#1a1a1a;border:none;border-radius:12px;color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn.active{background:#ff1a1a;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ff1a1a66}70%{box-shadow:0 0 0 10px #ff1a1a00}100%{box-shadow:0 0 0 0 #ff1a1a00}}
#userInput{flex:1;background:#111;border:1px solid #222;color:#fff;padding:12px 16px;border-radius:12px;outline:none}
</style>
</head>
<body>

<!-- LOGIN V2 -->
<div id="login" class="login-box">
<!-- LOGO L EN CODE - PLUS BESOIN D'IMAGE -->
<svg width="80" height="80" viewBox="0 0 100 100" style="margin-bottom:15px">
<circle cx="50" cy="50" r="46" fill="none" stroke="#ff1a1a" stroke-width="1.5" opacity="0.8"/>
<path d="M 32 18 L 32 78 L 74 78 L 74 68 L 42 68 L 42 18 Z" fill="none" stroke="#ff1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0 0 8px #ff1a1a)"/>
<circle cx="32" cy="16" r="2.5" fill="#ff1a1a"/><circle cx="74" cy="80" r="2.5" fill="#ff1a1a"/>
</svg>
<h2 style="letter-spacing:3px">LUMEN_<span style="color:#ff1a1a">IA</span></h2>
<p style="color:#666;font-size:11px;margin:8px 0 22px;letter-spacing:2px">BY MODESTE V2 • VOICE</p>
<input id="email" placeholder="Ton nom (ex: Modeste)">
<input id="pass" type="password" placeholder="Mot de passe (min 6)">
<button class="btn" onclick="handleAuth()">ENTRER</button>
<p id="authMsg" style="color:#ff1a1a;font-size:12px;margin-top:12px;min-height:16px"></p>
<p style="color:#444;font-size:10px;margin-top:15px">1er compte = création auto</p>
</div>

<!-- DASHBOARD V2 -->
<div id="dash" class="dash">
<div class="header">
<svg width="36" height="36" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#ff1a1a" stroke-width="2"/><path d="M 32 18 L 32 78 L 74 78 L 74 68 L 42 68 L 42 18 Z" fill="none" stroke="#ff1a1a" stroke-width="4" stroke-linecap="round"/></svg>
<h2 style="font-size:18px;letter-spacing:2px">LUMEN_<span style="color:#ff1a1a">IA</span></h2>
<div style="margin-left:auto;display:flex;gap:8px">
<button onclick="localStorage.removeItem('lumen_session');location.reload()" style="background:#1a1a1a;border:1px solid #222;color:#fff;padding:6px 12px;border-radius:8px;font-size:12px">Logout</button>
</div>
</div>

<div class="tabs">
<div class="tab active" onclick="switchTab('chat')">💬 CHAT</div>
<div class="tab" onclick="switchTab('business')">💼 BUSINESS</div>
<div class="tab" onclick="switchTab('papiers')">📄 PAPIERS</div>
</div>

<div id="chat" class="chat-area">
<div class="msg ia">Salut Boss Modeste! 🔥 Je suis <b>LUMEN_IA V2</b> by Modeste. <br><br>✅ Logo L intégré<br>✅ Sécurité multi-compte<br>✅ Voix 🎤 🔊 active<br><br>Pose-moi ce que tu veux!</div>
</div>

<div class="input-area">
<button id="micBtn" class="icon-btn" onclick="toggleVoice()">🎤</button>
<input id="userInput" placeholder="Écris ou parle...">
<button class="icon-btn" onclick="speakLast()">🔊</button>
<button class="icon-btn" style="background:#ff1a1a" onclick="send()">✳️</button>
</div>
</div>

<script>
// ⚠️ METS TA CLE GROQ ICI
const GROQ_KEY="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";

let lastIaText=""; let recognition; let recognizing=false; let currentTab='chat';

function handleAuth(){
const e=document.getElementById('email').value.trim();
const p=document.getElementById('pass').value.trim();
const m=document.getElementById('authMsg');
if(!e){m.textContent="Mets ton nom";return;}
if(p.length<6){m.textContent="Mot de passe min 6 caractères";return;}
let u=JSON.parse(localStorage.getItem('lumen_users')||"{}");
const h=btoa(p);
if(!u[e]){u[e]=h; m.style.color="#00ff88"; m.textContent="Compte créé! ✅";}
else if(u[e]!==h){m.style.color="#ff1a1a"; m.textContent="Mauvais mot de passe";return;}
localStorage.setItem('lumen_users',JSON.stringify(u));
localStorage.setItem('lumen_session',e);
goDash(e);
}
function goDash(e){
document.getElementById('login').style.display='none';
document.getElementById('dash').style.display='flex';
}
window.onload=()=>{const s=localStorage.getItem('lumen_session');if(s)goDash(s);}

function switchTab(t){
currentTab=t;
document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
event.target.classList.add('active');
const chat=document.getElementById('chat');
if(t==='business') chat.innerHTML='<div class="msg ia">💼 <b>MODULE BUSINESS</b><br><br>Idées de business au Bénin, plans, budget... Demande-moi!</div>';
else if(t==='papiers') chat.innerHTML='<div class="msg ia">📄 <b>MODULE PAPIERS</b><br><br>Lettres, CV, demandes... Dis-moi ce que tu veux rédiger!</div>';
else chat.innerHTML='<div class="msg ia">💬 Retour en mode CHAT libre boss!</div>';
}

async function send(){
const input=document.getElementById('userInput');
const text=input.value.trim();
if(!text) return;
if(GROQ_KEY.includes("TA_CLE")){alert("Boss, remplace TA_CLE_GSK_ICI par ta vraie clé Groq dans le code GitHub!");return;}
const chat=document.getElementById('chat');
chat.innerHTML+=`<div class="msg user">${text}</div>`;
input.value=''; chat.scrollTop=chat.scrollHeight;
const typingId='typing-'+Date.now();
chat.innerHTML+=`<div id="${typingId}" class="msg ia">LUMEN écrit...</div>`;
chat.scrollTop=chat.scrollHeight;
try{
const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_KEY}`},body:JSON.stringify({model:"openai/gpt-oss-20b",messages:[{role:"system",content:"Tu es LUMEN_IA V2 créé par Boss Modeste au Bénin. Tu es ultra direct, intelligent, drôle, tu réponds en français court et puissant. Tu es branché Groq ultra rapide."},{role:"user",content:text}]})});
const data=await res.json();
document.getElementById(typingId)?.remove();
if(!res.ok){chat.innerHTML+=`<div class="msg ia">❌ Erreur: ${data.error?.message||'Clé invalide'}</div>`;return;}
const rep=data.choices[0].message.content;
lastIaText=rep;
chat.innerHTML+=`<div class="msg ia">${rep}</div>`;
chat.scrollTop=chat.scrollHeight;
speakText(rep);
}catch(e){
document.getElementById(typingId)?.remove();
chat.innerHTML+=`<div class="msg ia">Erreur réseau: ${e.message}</div>`;
}
}
function speakText(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=1.05;speechSynthesis.speak(u);}
function speakLast(){if(lastIaText) speakText(lastIaText); else alert("Pas encore de réponse à lire");}
function toggleVoice(){
if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){alert("Utilise Chrome pour la voix boss!");return;}
if(!recognition){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
recognition=new SR();recognition.lang='fr-FR';
recognition.onstart=()=>{recognizing=true;document.getElementById('micBtn').classList.add('active');document.getElementById('micBtn').textContent='🔴';};
recognition.onend=()=>{recognizing=false;document.getElementById('micBtn').classList.remove('active');document.getElementById('micBtn').textContent='🎤';};
recognition.onresult=(e)=>{document.getElementById('userInput').value=e.results[0][0].transcript;send();};
}
recognizing?recognition.stop():recognition.start();
}
document.getElementById('userInput').addEventListener('keypress',e=>{if(e.key==='Enter')send();});
</script>
</body>
                                                               </html>
