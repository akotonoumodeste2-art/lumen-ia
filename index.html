<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMEN_IA - by Modeste</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif}
body{background:#000;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.login-box{background:#111;border:1px solid #222;padding:40px;border-radius:20px;width:90%;max-width:380px;text-align:center;box-shadow:0 0 30px rgba(255,0,0,0.2)}
.logo{font-size:40px;margin-bottom:10px}
h1{letter-spacing:4px;font-weight:900;margin-bottom:20px}
h1 span{color:#ff1a1a}
input{width:100%;padding:14px;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:15px;outline:none}
.btn{width:100%;padding:14px;background:#ff1a1a;border:none;border-radius:10px;color:#fff;font-weight:900;letter-spacing:2px;cursor:pointer}
.btn:hover{background:#ff0000}
.small{font-size:11px;color:#888;margin-top:15px}
.dashboard{display:none;width:100%;height:100vh;flex-direction:column}
.header{padding:15px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.chat-area{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:15px}
.msg{padding:12px 16px;border-radius:15px;max-width:80%;line-height:1.4}
.user{ background:#ff1a1a; align-self:flex-end; }
.ia{ background:#1a1a1a; border:1px solid #333; align-self:flex-start; }
.input-area{display:flex;gap:10px;padding:15px;background:#111;border-top:1px solid #222}
.input-area input{flex:1;margin:0}
.input-area button{padding:0 20px;background:#ff1a1a;border:none;border-radius:10px;color:#fff;font-weight:900;cursor:pointer}
.features{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:15px}
.feat{background:#111;border:1px solid #222;padding:15px;border-radius:12px;text-align:center;cursor:pointer}
.feat.active{border-color:#ff1a1a;background:#1a0000}
</style>
</head>
<body>

<div id="login" class="login-box">
<div class="logo">💀</div>
<h1>LUMEN_<span>IA</span></h1>
<input type="email" placeholder="Email" value="demo@lumen.ia">
<input type="password" placeholder="Mot de passe" value="demo123">
<button class="btn" onclick="goDashboard()">SE CONNECTER</button>
<p class="small">App démo - Clique SE CONNECTER pour voir le dashboard<br>By Modeste Akotonou</p>
</div>

<div id="dash" class="dashboard">
<div class="header">
<div><b>LUMEN_IA</b> <span style="color:#ff1a1a">● LIVE</span></div>
<div style="font-size:12px;cursor:pointer" onclick="location.reload()">Déconnexion</div>
</div>

<div class="features">
<div class="feat active">💬 CHAT IA</div>
<div class="feat">📚 DEVOIRS</div>
<div class="feat">💼 BUSINESS</div>
<div class="feat">📄 PAPIERS</div>
</div>

<div id="chat" class="chat-area">
<div class="msg ia">Salut Boss Modeste! 💀 Je suis LUMEN_IA, ton IA personnelle. Je suis branchée en direct avec Groq. Pose-moi ce que tu veux!</div>
</div>

<div class="input-area">
<input id="userInput" placeholder="Pose ta question à LUMEN_IA..." onkeypress="if(event.key==='Enter')send()">
<button onclick="send()">▶</button>
</div>
</div>

<script>
const GROQ_KEY = "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";

function goDashboard(){
 document.getElementById('login').style.display='none';
 document.getElementById('dash').style.display='flex';
}

async function send(){
 const input = document.getElementById('userInput');
 const text = input.value.trim();
 if(!text) return;

 const chat = document.getElementById('chat');
 chat.innerHTML += `<div class="msg user">${text}</div>`;
 input.value = '';
 chat.scrollTop = chat.scrollHeight;

 chat.innerHTML += `<div id="typing" class="msg ia">LUMEN_IA écrit...</div>`;

 try{
   const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
     method:'POST',
     headers:{
       'Content-Type':'application/json',
       'Authorization': `Bearer ${GROQ_KEY}`
     },
     body: JSON.stringify({
       model: 'llama-3.1-8b-instant',
       messages: [
         {role:'system', content:'Tu es LUMEN_IA, IA créée par Modeste Akotonou, boss de Abomey-Calavi, Bénin. Tu es ultra intelligente, directe, tu parles français avec style street boss. Tu aides pour devoirs, business, papiers, traductions.'},
         {role:'user', content: text}
       ]
     })
   });
   const data = await res.json();
   const reply = data.choices[0].message.content;
   document.getElementById('typing').remove();
   chat.innerHTML += `<div class="msg ia">${reply}</div>`;
   chat.scrollTop = chat.scrollHeight;
 } catch(e){
   document.getElementById('typing').remove();
   chat.innerHTML += `<div class="msg ia">Erreur boss, vérifie ta clé Groq 😔 ${e}</div>`;
 }
}
</script>
</body>
</html>
