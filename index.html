<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMEN_IA - by Modeste</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-box{background:#111;border:1px solid #ff1a1a;padding:30px;border-radius:15px;width:90%;max-width:350px;text-align:center}
.logo{font-size:40px;margin-bottom:10px}
h1{letter-spacing:4px;font-weight:900;margin-bottom:5px}
h1 span{color:#ff1a1a}
h1+p{color:#888;font-size:12px;margin-bottom:25px;letter-spacing:2px}
input{width:100%;padding:14px;background:#000;border:1px solid #333;color:#fff;border-radius:8px;margin-bottom:15px;outline:none}
input:focus{border-color:#ff1a1a}
.btn{width:100%;padding:14px;background:#ff1a1a;border:none;color:#fff;font-weight:900;border-radius:8px;cursor:pointer;letter-spacing:1px}
.btn:hover{background:#cc0000}
.dash{display:none;width:100%;max-width:600px;height:100vh;flex-direction:column;padding:15px}
.feats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.feat{background:#111;border:1px solid #222;padding:15px;border-radius:10px;text-align:center;font-weight:bold}
.feat.active{border-color:#ff1a1a;background:#1a0000}
.chat-area{flex:1;background:#0a0a0a;border:1px solid #222;border-radius:10px;padding:15px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:15px}
.msg{padding:10px 14px;border-radius:15px;max-width:85%;line-height:1.4}
.msg.ia{background:#111;border:1px solid #222;align-self:flex-start}
.msg.user{background:#ff1a1a;align-self:flex-end}
.input-area{display:flex;gap:10px}
.input-area input{margin:0;flex:1}
.input-area button{background:#ff1a1a;border:none;width:50px;border-radius:8px;color:#fff;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div id="login" class="login-box">
<div class="logo">💀</div>
<h1>LUMEN_<span>IA</span></h1>
<p>BY MODESTE</p>
<input id="user" placeholder="Nom d'utilisateur">
<input id="pass" type="password" placeholder="Mot de passe">
<button class="btn" onclick="goDash()">ENTRER</button>
<p style="margin-top:15px;font-size:11px;color:#666">Modeste / 1234</p>
</div>

<div id="dash" class="dash">
<div class="feats">
<div class="feat active">💬 CHAT IA</div>
<div class="feat">📚 DEVOIRS</div>
<div class="feat">💼 BUSINESS</div>
<div class="feat">📄 PAPIERS</div>
</div>

<div id="chat" class="chat-area">
<div class="msg ia">Salut Boss Modeste! 💀 Je suis LUMEN_IA, branchée Groq ultra rapide. Pose-moi ce que tu veux!</div>
</div>

<div class="input-area">
<input id="userInput" placeholder="Pose ta question à LUMEN_IA...">
<button onclick="send()">▶</button>
</div>
</div>

<script>
const GROQ_KEY = "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";

function goDash(){
 document.getElementById('login').style.display='none';
 document.getElementById('dash').style.display='flex';
}

async function send(){
 const input = document.getElementById('userInput');
 const text = input.value.trim();
 if(!text) return;
 const chat = document.getElementById('chat');
 chat.innerHTML += `<div class="msg user">${text}</div>`;
 input.value = '';
 chat.scrollTop = chat.scrollHeight;
 chat.innerHTML += `<div id="typing" class="msg ia">LUMEN_IA écrit...</div>`;

 try{
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions",{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization":`Bearer ${GROQ_KEY}`},
   body: JSON.stringify({
    model:"llama-3.3-70b-versatile",
    messages:[
     {role:"system", content:"Tu es LUMEN_IA, IA personnelle de Boss Modeste. Tu réponds court, direct, style boss, en français."},
     {role:"user", content:text}
    ]
   })
  });
  const data = await res.json();
  document.getElementById('typing').remove();
  if(!res.ok){
   chat.innerHTML += `<div class="msg ia">Erreur Groq: ${data.error?.message || 'clé invalide'}</div>`;
  } else {
   chat.innerHTML += `<div class="msg ia">${data.choices[0].message.content}</div>`;
  }
 } catch(e){
  document.getElementById('typing')?.remove();
  chat.innerHTML += `<div class="msg ia">Erreur réseau: ${e.message}</div>`;
 }
 chat.scrollTop = chat.scrollHeight;
}
document.getElementById('userInput').addEventListener('keypress', (e)=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
